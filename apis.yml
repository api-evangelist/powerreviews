  - type: Overlay
    url: overlays/powerreviews-readservices-overlay.yaml
- aid: powerreviews:powerreviews-write-api
  name: PowerReviews Write API
  description: The PowerReviews Write API (the B2B WriteServices surface) provides server-to-server integration
    endpoints for the PowerReviews Write-a-Review form. It retrieves the locale-aware review template
    for a page id and submits reviews, questions, answers, and merchant responses on behalf of a merchant,
    including the iOvation device fingerprint required for content authenticity screening. Submitted content
    enters PowerReviews in pending status for moderation.
  humanURL: https://developers.powerreviews.com/Content/Write%20API/Write%20API.htm
  baseURL: https://writeservices.powerreviews.com
