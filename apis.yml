aid: powerreviews
name: PowerReviews
description: 'PowerReviews provides ratings and reviews software and APIs for collecting, syndicating,
  and displaying user-generated reviews, questions, and answers so shoppers can make better purchase decisions
  and retailers and brands can drive e-commerce conversion. The platform publishes two public HTTP API
  surfaces: a Read API (readservices-b2c.powerreviews.com) that returns reviews, questions, answers, product
  snippets, and merchant display configuration for a merchant and locale, and a Write API (writeservices.powerreviews.com)
  that retrieves the write-a-review template and submits reviews, questions, answers, and merchant responses
  server-to-server. Both are authenticated with a merchant-scoped apikey query parameter issued by PowerReviews
  support, and are documented in a MadCap Flare developer portal with Swagger 2.0 references. PowerReviews
  was acquired by Syndigo and now sits inside the Syndigo Product Experience Cloud.'
