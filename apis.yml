apis:
- aid: powerreviews:powerreviews-api
  name: PowerReviews Read API
  description: The PowerReviews Read API returns reviews, questions, answers, product review snippets,
    and merchant display configuration left on a merchant's products by their customers. It is used to
    render user-generated content in custom storefronts and mobile apps, and to feed review data into
    CRM, analytics, and third-party software. All operations are GET requests keyed by merchant id and
    locale, authenticated with an apikey query parameter.
  humanURL: https://developers.powerreviews.com/Content/Read%20API/Read%20API.htm
  baseURL: https://readservices-b2c.powerreviews.com
  tags:
