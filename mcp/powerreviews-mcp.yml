caveats:
  - >-
    The Write API has no idempotency contract, so a retried submit_* tool call can
    create duplicate user-generated content. Any real server would need to
    de-duplicate on merchant_question_id / unique_review_id.
  - >-
    The Read API's QueryResponse.results is untyped, so a derived tool cannot
    advertise an accurate output schema.
  - >-
    Review submission requires an iOvation device-fingerprint BlackBox value
    produced by a browser script; a headless agent cannot generate one.
crosswalk: mcp/powerreviews-tool-crosswalk.yml
