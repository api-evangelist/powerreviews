source: https://ui.powerreviews.com/stable/4.1/ui.js
note: >-
  PowerReviews' primary integration surface for most customers is not the HTTP
  API at all — it is a client-side display library loaded from
  ui.powerreviews.com that renders reviews, ratings, snippets, Q&A and the
  write-a-review form directly into a retailer's product detail page. The loader
  was probed live on 2026-08-13. PowerReviews publishes no public component
  reference on developers.powerreviews.com (that portal documents only the Read
  and Write HTTP APIs), so the component families below are recorded from the
  served artifact and the product pages, and the per-component configuration
  reference remains customer-only.
